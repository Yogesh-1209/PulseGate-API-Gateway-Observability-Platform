# docker-compose.yml
#
# Runs 4 services:
#   redis           — official Redis image, no config needed
#   users-service   — our Users Express app
#   products-service— our Products Express app
#   gateway         — the API Gateway (only public-facing port)
#
# Networking:
#   All services share the "api-net" bridge network.
#   On this network, each service is reachable by its SERVICE NAME as hostname.
#   That's why the gateway .env uses:
#     USERS_SERVICE_URL=http://users-service:3001
#   Docker DNS resolves "users-service" to the container's internal IP.
#
# Only the gateway (port 3000) is exposed to your machine.
# Redis and backend services are NOT reachable from outside Docker.

services:

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: api-redis
    restart: unless-stopped
    networks:
      - api-net
    # Persist Redis data across restarts (optional but good practice)
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Users Service ──────────────────────────────────────────────────────────
  users-service:
    build:
      context: ./services/users-service
      dockerfile: Dockerfile
    container_name: users-service
    restart: unless-stopped
    environment:
      PORT: 3001
    networks:
      - api-net
    # NOT exposed to host — only the gateway talks to it
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Products Service ───────────────────────────────────────────────────────
  products-service:
    build:
      context: ./services/products-service
      dockerfile: Dockerfile
    container_name: products-service
    restart: unless-stopped
    environment:
      PORT: 3002
    networks:
      - api-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── API Gateway ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      # Only the gateway is exposed: localhost:3000 → container:3000
      - "3000:3000"
    environment:
      PORT: 3000
      API_KEYS: key-client-abc-123,key-client-xyz-456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMIT_MAX: 20
      RATE_LIMIT_WINDOW_SECONDS: 60
      PROXY_TIMEOUT_MS: 5000
      USERS_SERVICE_URL: http://users-service:3001
      PRODUCTS_SERVICE_URL: http://products-service:3002
    networks:
      - api-net
    depends_on:
      redis:
        condition: service_healthy
      users-service:
        condition: service_started
      products-service:
        condition: service_started

  # ── Dashboard ───────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: api-dashboard
    restart: unless-stopped
    ports:
      # Dashboard UI: open http://localhost:4000 in your browser
      - "4000:4000"
    networks:
      - api-net
    depends_on:
      - gateway

# ── Shared Network ─────────────────────────────────────────────────────────
networks:
  api-net:
    driver: bridge

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  redis-data:
